system:
  device: "cuda"
  seed: 42
  precision: "float16"
  kinematics_precision: "float32"

training:
  batch_size: 4
  accumulate_grad_batches: 2
  learning_rate_stage1: 3.0e-4
  learning_rate_stage2: 2.0e-4
  weight_decay: 1.0e-4
  max_grad_norm: 1.0

dataset:
  max_pocket_residues: 48
  max_pocket_atoms: 300
  pocket_crop_radius: 10.0
  max_ligand_atoms: 60

freesolve:
  grid_dim: 24
  grid_spacing: 1.0
  epsilon_in: 4.0
  epsilon_water: 78.5
  vdw_e_cap: 25.0
  vdw_s0: 10.0
  lambda_fs: 0.08
  relax_steps: 25
  alpha_fs: 0.05

tokenizer:
  s1_codebook_size: 512
  s1_dim: 32
  s2a_codebook_size: 512
  s2a_dim: 32
  s2b_codebook_size: 1024
  s2b_dim: 64
  s34_codebook_size: 1024
  s34_dim: 64
  decay: 0.99
  threshold_ema_dead_code: 2
  loss_weights:
    s4_sym_rmsd: 1.0
    s3_core_rmsd: 0.5
    s2_rigid: 0.25
    freesolve: 0.08
    commit: 0.25

generator:
  num_layers: 6
  d_model: 256
  n_heads: 4
  ffn_type: "swiglu"
  dropout: 0.1
  p_perturb: 0.25
  beam_width: 8
  diversity_penalty: 1.5
  num_groups: 2
  total_tokens: 11
  scale_slices:
    s1: [0, 1]
    s2: [1, 3]
    s3: [3, 7]
    s4: [7, 11]
